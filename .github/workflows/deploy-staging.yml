name: Deploy to Staging

on:
  push:
    branches: [main]  # Changed from develop to main
  workflow_dispatch: # Allow manual triggering

jobs:
  build-and-deploy:
    name: Build & Deploy to Staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ secrets.STAGING_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm install

      - name: Install blocks dependencies
        working-directory: ./blocks
        run: npm ci

      - name: Build blocks
        working-directory: ./blocks
        run: npm run build

      - name: Create .env file from secrets
        run: |
          cat > .env << EOF
          STAGING_SFTP_HOST=${{ secrets.STAGING_SFTP_HOST }}
          STAGING_SFTP_PORT=${{ secrets.STAGING_SFTP_PORT }}
          STAGING_SFTP_USER=${{ secrets.STAGING_SFTP_USER }}
          STAGING_SFTP_PASSWORD=${{ secrets.STAGING_SFTP_PASSWORD }}
          STAGING_PATH=${{ secrets.STAGING_PATH }}
          STAGING_URL=${{ secrets.STAGING_URL }}
          EOF
          echo "✅ .env file created from GitHub Secrets"

      - name: Deploy theme to staging
        run: node deploy-theme-staging.js

      - name: Deploy blocks to staging
        run: node deploy-blocks-complete.js

      - name: Deployment summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: Staging" >> $GITHUB_STEP_SUMMARY
          echo "- **Server**: Strato (SFTP)" >> $GITHUB_STEP_SUMMARY
          echo "- **Path**: ${{ secrets.STAGING_PATH }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ Success" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Deployed Components" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Theme files (style.css, functions.php, theme.json, index.php)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Blocks (Hero, Content Section, Card Grid, CTA Section, Button)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Block build files (JavaScript, CSS)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Components library" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Patterns" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Templates & Template Parts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🌐 **View site**: ${{ secrets.STAGING_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "🔧 **Admin**: ${{ secrets.STAGING_URL }}/wp-admin" >> $GITHUB_STEP_SUMMARY

  notify:
    name: Send Deployment Notification
    runs-on: ubuntu-latest
    needs: [build-and-deploy]
    if: always()

    steps:
      - name: Deployment status
        run: |
          if [ "${{ needs.build-and-deploy.result }}" == "success" ]; then
            echo "✅ Deployment to staging succeeded"
          else
            echo "❌ Deployment to staging failed"
            exit 1
          fi
