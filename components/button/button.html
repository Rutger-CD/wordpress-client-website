<!-- ===================================
 * BUTTON COMPONENT
 * All variants with different states and sizes
 * =================================== -->

<!-- Primary Buttons -->
<div class="demo-section">
  <h3>Primary Buttons</h3>

  <!-- Large -->
  <button class="btn btn--primary btn--large">
    Primary Large
  </button>

  <!-- Medium (default) -->
  <button class="btn btn--primary">
    Primary Button
  </button>

  <!-- Small -->
  <button class="btn btn--primary btn--small">
    Primary Small
  </button>

  <!-- With Icon -->
  <button class="btn btn--primary">
    <svg class="btn__icon" width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
      <path d="M10 5v10m-5-5h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <span class="btn__text">With Icon</span>
  </button>

  <!-- Icon Only -->
  <button class="btn btn--primary btn--icon-only" aria-label="Add item">
    <svg class="btn__icon" width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
      <path d="M10 5v10m-5-5h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </button>

  <!-- Loading -->
  <button class="btn btn--primary btn--loading" disabled>
    <span class="btn__spinner" aria-hidden="true"></span>
    <span class="btn__text">Loading...</span>
  </button>

  <!-- Disabled -->
  <button class="btn btn--primary" disabled>
    Disabled
  </button>
</div>
