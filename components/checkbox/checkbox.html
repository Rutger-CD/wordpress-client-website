<!-- ===================================

<!-- Basic Checkbox -->
<div class="demo-section">
  <h3>Basic Checkbox</h3>

  <label class="checkbox">
    <input type="checkbox" class="checkbox__input" />
    <span class="checkbox__box">
      <svg class="checkbox__checkmark" viewBox="0 0 12 12" fill="none">
        <path d="M10 3L4.5 8.5L2 6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
    <span class="checkbox__label">I agree to the terms and conditions</span>
  </label>
</div>

<!-- Checkbox Sizes -->

  <div style="display: flex; flex-direction: column; gap: var(--spacing-3);">

    <label class="checkbox checkbox--small">
      <input type="checkbox" class="checkbox__input" checked />

        <svg class="checkbox__checkmark" viewBox="0 0 12 12" fill="none">
          <path d="M10 3L4.5 8.5L2 6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="checkbox__label">Small checkbox</span>
    </label>

    <!-- Medium (default) -->
    <label class="checkbox">
      <input type="checkbox" class="checkbox__input" checked />
      <span class="checkbox__box">
        <svg class="checkbox__checkmark" viewBox="0 0 12 12" fill="none">
          <path d="M10 3L4.5 8.5L2 6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="checkbox__label">Medium checkbox (default)</span>
    </label>

    <!-- Large -->
    <label class="checkbox checkbox--large">
      <input type="checkbox" class="checkbox__input" checked />
      <span class="checkbox__box">
        <svg class="checkbox__checkmark" viewBox="0 0 12 12" fill="none">
          <path d="M10 3L4.5 8.5L2 6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="checkbox__label">Large checkbox</span>
    </label>
  </div>
</div>

<!-- Checkbox States -->
<div class="demo-section">
  <h3>Checkbox States</h3>

  <div style="display: flex; flex-direction: column; gap: var(--spacing-3);">
    <!-- Unchecked -->
    <label class="checkbox">
      <input type="checkbox" class="checkbox__input" />
      <span class="checkbox__box">
        <svg class="checkbox__checkmark" viewBox="0 0 12 12" fill="none">
          <path d="M10 3L4.5 8.5L2 6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="checkbox__label">Unchecked</span>
    </label>

    <!-- Checked -->
    <label class="checkbox">
      <input type="checkbox" class="checkbox__input" checked />
      <span class="checkbox__box">
        <svg class="checkbox__checkmark" viewBox="0 0 12 12" fill="none">
          <path d="M10 3L4.5 8.5L2 6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="checkbox__label">Checked</span>
    </label>

    <!-- Indeterminate -->
    <label class="checkbox">
      <input type="checkbox" class="checkbox__input" id="indeterminate-demo" />
      <span class="checkbox__box">
        <svg class="checkbox__checkmark" viewBox="0 0 12 12" fill="none">
          <path d="M10 3L4.5 8.5L2 6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="checkbox__label">Indeterminate (some items selected)</span>
    </label>

    <!-- Disabled Unchecked -->
    <label class="checkbox">
      <input type="checkbox" class="checkbox__input" disabled />
      <span class="checkbox__box">
        <svg class="checkbox__checkmark" viewBox="0 0 12 12" fill="none">
          <path d="M10 3L4.5 8.5L2 6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="checkbox__label">Disabled unchecked</span>
    </label>

    <!-- Disabled Checked -->
    <label class="checkbox">
      <input type="checkbox" class="checkbox__input" checked disabled />
      <span class="checkbox__box">
        <svg class="checkbox__checkmark" viewBox="0 0 12 12" fill="none">
          <path d="M10 3L4.5 8.5L2 6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="checkbox__label">Disabled checked</span>
    </label>
  </div>
</div>

<!-- Required Checkbox Group -->
<div class="demo-section">
  <h3>Required Checkbox Group</h3>

  <div class="checkbox-group checkbox-group--error">
    <label class="checkbox-group__label checkbox-group__label--required">
      Accept terms
    </label>

    <label class="checkbox checkbox--error">
      <input type="checkbox" class="checkbox__input" required />
      <span class="checkbox__box">
        <svg class="checkbox__checkmark" viewBox="0 0 12 12" fill="none">

        </svg>
      </span>
      <span class="checkbox__label">I agree to the Terms of Service</span>

      <input type="checkbox" class="checkbox__input" required />
      <span class="checkbox__box">
        <svg class="checkbox__checkmark" viewBox="0 0 12 12" fill="none">

<!-- Settings Form Example -->
<div class="demo-section">
  <h3>Settings Form Example</h3>

  <form style="max-width: 500px;">
    <div style="display: flex; flex-direction: column; gap: var(--spacing-5);">
      <div>
        <h4 style="margin-bottom: var(--spacing-3); font-size: var(--text-lg);">Notifications</h4>
        <div style="display: flex; flex-direction: column; gap: var(--spacing-3);">
          <label class="checkbox checkbox--switch">
            <input type="checkbox" class="checkbox__input" checked />
            <span class="checkbox__box">
              <svg class="checkbox__checkmark" viewBox="0 0 12 12" fill="none">
                <path d="M10 3L4.5 8.5L2 6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <span class="checkbox__label">Email notifications</span>
          </label>

          <label class="checkbox checkbox--switch">
            <input type="checkbox" class="checkbox__input" checked />
            <span class="checkbox__box">
              <svg class="checkbox__checkmark" viewBox="0 0 12 12" fill="none">
                <path d="M10 3L4.5 8.5L2 6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <span class="checkbox__label">Push notifications</span>
          </label>

          <label class="checkbox checkbox--switch">
            <input type="checkbox" class="checkbox__input" />
            <span class="checkbox__box">
              <svg class="checkbox__checkmark" viewBox="0 0 12 12" fill="none">
                <path d="M10 3L4.5 8.5L2 6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <span class="checkbox__label">SMS notifications</span>
          </label>
        </div>
      </div>

      <div>
        <h4 style="margin-bottom: var(--spacing-3); font-size: var(--text-lg);">Privacy</h4>
        <div style="display: flex; flex-direction: column; gap: var(--spacing-3);">
          <label class="checkbox checkbox--switch">
            <input type="checkbox" class="checkbox__input" />
            <span class="checkbox__box">
              <svg class="checkbox__checkmark" viewBox="0 0 12 12" fill="none">
                <path d="M10 3L4.5 8.5L2 6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <span class="checkbox__label">Make profile public</span>
          </label>

          <label class="checkbox checkbox--switch">
            <input type="checkbox" class="checkbox__input" checked />
            <span class="checkbox__box">
              <svg class="checkbox__checkmark" viewBox="0 0 12 12" fill="none">
                <path d="M10 3L4.5 8.5L2 6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <span class="checkbox__label">Show online status</span>
          </label>
        </div>
      </div>

      <div style="display: flex; gap: var(--spacing-3);">
        <button type="submit" class="btn btn--primary">Save Settings</button>
        <button type="reset" class="btn btn--ghost">Reset</button>
      </div>
    </div>
  </form>
</div>

<script>
// Set indeterminate state for demo
document.addEventListener('DOMContentLoaded', function() {
  const indeterminateCheckbox = document.getElementById('indeterminate-demo');
  if (indeterminateCheckbox) {
    indeterminateCheckbox.indeterminate = true;
  }
});
</script>
